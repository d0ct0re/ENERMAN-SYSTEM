name: Deploy to Hostinger

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Build de producción
        run: npm run build

      # Reemplaza el script casero de lftp (tres bugs distintos ya encontrados:
      # ruta remota mal resuelta, mirror que salta index.html por comparar
      # solo tamano, sintaxis invalida de "-rm", y una cuarta falla sin
      # explicacion clara) por una Action mantenida y probada por miles de
      # repos, que hace diff real por checksum contra un archivo de estado
      # en el servidor en vez de tamano/fecha.
      - name: Subir frontend (dist/) a Hostinger
        id: deploy_frontend
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          protocol: ftp
          local-dir: ./dist/
          server-dir: /domains/ampr.site/public_html/
          log-level: verbose

      # Hostinger corta la conexion FTP de forma intermitente ("Timeout
      # (control socket)") — no es un bug de codigo, es la conexion en si.
      # Un segundo intento en una conexion nueva casi siempre pasa.
      - name: Reintentar subida de frontend si el primer intento fallo
        if: steps.deploy_frontend.outcome == 'failure'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          protocol: ftp
          local-dir: ./dist/
          server-dir: /domains/ampr.site/public_html/
          log-level: verbose

      # Defensa en profundidad: no confiar ciegamente en que el paso anterior
      # reporte exito (ya pasamos por varias fallas silenciosas de FTP donde
      # el sitio quedo semanas sirviendo un build viejo con el check en
      # verde). Esta verificacion compara el hash del bundle recien
      # construido contra el que realmente responde el sitio en vivo, y hace
      # fallar el job en rojo si no coinciden.
      - name: Verificar que el frontend realmente se publico
        run: |
          EXPECTED=$(grep -o '/assets/index-[A-Za-z0-9_-]*\.js' dist/index.html | head -1)
          if [ -z "$EXPECTED" ]; then
            echo "No se pudo determinar el bundle esperado desde dist/index.html"
            exit 1
          fi
          echo "Bundle esperado: $EXPECTED"
          LIVE=""
          for i in 1 2 3 4 5 6; do
            LIVE=$(curl -s https://ampr.site/ | grep -o '/assets/index-[A-Za-z0-9_-]*\.js' | head -1)
            echo "Intento $i - bundle en vivo: $LIVE"
            if [ "$LIVE" = "$EXPECTED" ]; then
              echo "Deploy verificado: el sitio en vivo sirve el build nuevo."
              exit 0
            fi
            sleep 10
          done
          echo "ERROR: el sitio en vivo sigue sirviendo un bundle distinto al recien subido."
          echo "Esperado: $EXPECTED"
          echo "En vivo:  $LIVE"
          exit 1

      - name: Subir API (api/) a Hostinger
        id: deploy_api
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          protocol: ftp
          local-dir: ./api/
          server-dir: /domains/ampr.site/public_html/api/
          log-level: verbose
          exclude: |
            **/config.php

      - name: Reintentar subida de API si el primer intento fallo
        id: deploy_api_retry
        if: steps.deploy_api.outcome == 'failure'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          protocol: ftp
          local-dir: ./api/
          server-dir: /domains/ampr.site/public_html/api/
          log-level: verbose
          exclude: |
            **/config.php

      # No hay forma de verificar la API contra el sitio real como se hace
      # con el frontend (no tiene un hash de build) — asi que si el primer
      # intento fallo, el job solo puede darse por bueno si el reintento
      # realmente funciono.
      - name: Fallar el job si ninguno de los dos intentos de API funciono
        if: steps.deploy_api.outcome == 'failure' && steps.deploy_api_retry.outcome != 'success'
        run: |
          echo "La subida de la API fallo incluso tras reintentar."
          exit 1

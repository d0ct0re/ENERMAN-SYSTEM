name: Deploy to Hostinger

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Build de producción
        run: npm run build

      - name: Instalar lftp
        run: sudo apt-get install -y lftp

      - name: Subir frontend (dist/) a Hostinger
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
        run: |
          lftp -u "$FTP_USER","$FTP_PASS" "ftp://$FTP_HOST" <<'LFTP_EOF'
          set ftp:passive-mode true
          set net:timeout 120
          set net:max-retries 10
          set net:reconnect-interval-base 10
          set net:reconnect-interval-multiplier 1.5
          set ssl:verify-certificate false
          set ftp:use-feat false
          set mirror:parallel-transfer-count 2
          mirror -R --exclude=api/ --delete dist/ /public_html/
          quit
          LFTP_EOF

      - name: Subir API (api/) a Hostinger
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
        run: |
          lftp -u "$FTP_USER","$FTP_PASS" "ftp://$FTP_HOST" <<'LFTP_EOF'
          set ftp:passive-mode true
          set net:timeout 120
          set net:max-retries 10
          set net:reconnect-interval-base 10
          set net:reconnect-interval-multiplier 1.5
          set ssl:verify-certificate false
          set ftp:use-feat false
          set mirror:parallel-transfer-count 2
          mirror -R --delete api/ /public_html/api/
          quit
          LFTP_EOF

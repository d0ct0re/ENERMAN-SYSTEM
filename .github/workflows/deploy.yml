name: Deploy to Hostinger

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Build de producción
        run: npm run build

      # Reemplaza el script casero de lftp (tres bugs distintos ya encontrados:
      # ruta remota mal resuelta, mirror que salta index.html por comparar
      # solo tamano, sintaxis invalida de "-rm", y una cuarta falla sin
      # explicacion clara) por una Action mantenida y probada por miles de
      # repos, que hace diff real por checksum contra un archivo de estado
      # en el servidor en vez de tamano/fecha.
      - name: Subir frontend (dist/) a Hostinger
        id: deploy_frontend
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          protocol: ftp
          local-dir: ./dist/
          server-dir: /domains/ampr.site/public_html/
          log-level: verbose

      # Hostinger corta la conexion FTP de forma intermitente ("Timeout
      # (control socket)") — no es un bug de codigo, es la conexion en si.
      # Un segundo intento en una conexion nueva casi siempre pasa.
      - name: Reintentar subida de frontend si el primer intento fallo
        if: steps.deploy_frontend.outcome == 'failure'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          protocol: ftp
          local-dir: ./dist/
          server-dir: /domains/ampr.site/public_html/
          log-level: verbose

      # Defensa en profundidad: no confiar ciegamente en que el paso anterior
      # reporte exito. Ya vimos que tanto lftp como esta Action pueden decir
      # "listo" sin haber cambiado nada en el servidor (Hostinger es
      # inestable de por si). Esta verificacion compara el bundle recien
      # construido contra el que realmente responde el sitio en vivo; si no
      # coincide, sube dist/ de nuevo por FTP directo via curl (el mismo
      # metodo que ya funciono a mano, sin herramientas de por medio) antes
      # de rendirse.
      - name: Verificar que el frontend realmente se publico (con respaldo por FTP directo)
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
        run: |
          EXPECTED=$(grep -o '/assets/index-[A-Za-z0-9_-]*\.js' dist/index.html | head -1)
          if [ -z "$EXPECTED" ]; then
            echo "No se pudo determinar el bundle esperado desde dist/index.html"
            exit 1
          fi
          echo "Bundle esperado: $EXPECTED"

          check_live() {
            curl -s https://ampr.site/ | grep -o '/assets/index-[A-Za-z0-9_-]*\.js' | head -1
          }

          LIVE=""
          for i in 1 2 3; do
            LIVE=$(check_live)
            echo "Intento $i - bundle en vivo: $LIVE"
            if [ "$LIVE" = "$EXPECTED" ]; then
              echo "Deploy verificado: el sitio en vivo sirve el build nuevo."
              exit 0
            fi
            sleep 10
          done

          echo "La Action no publico el build (o Hostinger corto la conexion). Subiendo dist/ por FTP directo como respaldo..."
          cd dist
          find . -type f | sed 's|^\./||' | while read -r f; do
            curl -s -T "$f" "ftp://$FTP_HOST/domains/ampr.site/public_html/$f" --user "$FTP_USER:$FTP_PASS" --ftp-create-dirs -o /dev/null -w "  $f -> %{http_code}\n"
          done
          cd ..

          for i in 1 2 3; do
            sleep 5
            LIVE=$(check_live)
            echo "Post-respaldo intento $i - bundle en vivo: $LIVE"
            if [ "$LIVE" = "$EXPECTED" ]; then
              echo "Deploy verificado tras respaldo por FTP directo."
              exit 0
            fi
          done

          echo "ERROR: el sitio en vivo sigue sin coincidir incluso tras el respaldo por FTP directo."
          echo "Esperado: $EXPECTED"
          echo "En vivo:  $LIVE"
          exit 1

      - name: Subir API (api/) a Hostinger
        id: deploy_api
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          protocol: ftp
          local-dir: ./api/
          server-dir: /domains/ampr.site/public_html/api/
          log-level: verbose
          exclude: |
            **/config.php

      - name: Reintentar subida de API si el primer intento fallo
        id: deploy_api_retry
        if: steps.deploy_api.outcome == 'failure'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          protocol: ftp
          local-dir: ./api/
          server-dir: /domains/ampr.site/public_html/api/
          log-level: verbose
          exclude: |
            **/config.php

      # No hay forma de verificar la API contra el sitio real como se hace
      # con el frontend (no tiene un hash de build) — asi que si ambos
      # intentos de la Action fallaron, se sube por FTP directo via curl
      # (mismo metodo probado en el paso del frontend) antes de rendirse.
      - name: Respaldo por FTP directo si ninguno de los dos intentos de API funciono
        if: steps.deploy_api.outcome == 'failure' && steps.deploy_api_retry.outcome != 'success'
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
        run: |
          echo "La Action fallo dos veces subiendo la API. Subiendo por FTP directo como respaldo..."
          cd api
          find . -type f ! -name 'config.php' | sed 's|^\./||' | while read -r f; do
            curl -sf -T "$f" "ftp://$FTP_HOST/domains/ampr.site/public_html/api/$f" --user "$FTP_USER:$FTP_PASS" --ftp-create-dirs -o /dev/null -w "  $f -> %{http_code}\n" || exit 1
          done

name: Deploy to Staging

on:
  push:
    branches: [dev]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Build de staging (base path /staging/)
        run: npm run build:staging

      - name: Ajustar .htaccess para subcarpeta /staging/
        run: |
          cat > dist/.htaccess <<'HTACCESS_EOF'
          <IfModule mod_rewrite.c>
            RewriteEngine On
            RewriteBase /staging/
            RewriteCond %{REQUEST_FILENAME} !-f
            RewriteCond %{REQUEST_FILENAME} !-d
            RewriteRule . /staging/index.html [L]
          </IfModule>

          <IfModule mod_headers.c>
            Header always set X-Content-Type-Options "nosniff"
            Header always set X-Frame-Options "DENY"
            Header always set Referrer-Policy "strict-origin-when-cross-origin"
            Header always set X-XSS-Protection "1; mode=block"
            Header always set Permissions-Policy "camera=(), microphone=(), geolocation=()"
          </IfModule>
          HTACCESS_EOF

      - name: Subir frontend (dist/) a Hostinger /staging/
        id: deploy_frontend
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          protocol: ftp
          local-dir: ./dist/
          server-dir: /domains/ampr.site/public_html/staging/
          log-level: verbose

      # Hostinger corta la conexion FTP de forma intermitente ("Timeout
      # (control socket)") — un segundo intento en una conexion nueva casi
      # siempre pasa.
      - name: Reintentar subida de frontend si el primer intento fallo
        if: steps.deploy_frontend.outcome == 'failure'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          protocol: ftp
          local-dir: ./dist/
          server-dir: /domains/ampr.site/public_html/staging/
          log-level: verbose

      # Mismo principio que el deploy de produccion: lftp puede reportar exito
      # sin haber subido nada de verdad. Verificamos contra el sitio real.
      - name: Verificar que el staging realmente se publico
        run: |
          EXPECTED=$(grep -o '/staging/assets/index-[A-Za-z0-9_-]*\.js' dist/index.html | head -1)
          if [ -z "$EXPECTED" ]; then
            echo "No se pudo determinar el bundle esperado desde dist/index.html"
            exit 1
          fi
          echo "Bundle esperado: $EXPECTED"
          LIVE=""
          for i in 1 2 3 4 5 6; do
            LIVE=$(curl -s https://ampr.site/staging/ | grep -o '/staging/assets/index-[A-Za-z0-9_-]*\.js' | head -1)
            echo "Intento $i - bundle en vivo: $LIVE"
            if [ "$LIVE" = "$EXPECTED" ]; then
              echo "Deploy de staging verificado."
              exit 0
            fi
            sleep 10
          done
          echo "ERROR: staging sigue sirviendo un bundle distinto al recien subido."
          echo "Esperado: $EXPECTED"
          echo "En vivo:  $LIVE"
          exit 1

      - name: Subir API (api/) a Hostinger /staging/api/
        id: deploy_api
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          protocol: ftp
          local-dir: ./api/
          server-dir: /domains/ampr.site/public_html/staging/api/
          log-level: verbose
          exclude: |
            **/config.php

      - name: Reintentar subida de API si el primer intento fallo
        id: deploy_api_retry
        if: steps.deploy_api.outcome == 'failure'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          protocol: ftp
          local-dir: ./api/
          server-dir: /domains/ampr.site/public_html/staging/api/
          log-level: verbose
          exclude: |
            **/config.php

      - name: Fallar el job si ninguno de los dos intentos de API funciono
        if: steps.deploy_api.outcome == 'failure' && steps.deploy_api_retry.outcome != 'success'
        run: |
          echo "La subida de la API de staging fallo incluso tras reintentar."
          exit 1

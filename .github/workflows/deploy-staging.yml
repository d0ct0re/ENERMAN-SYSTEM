name: Deploy to Staging

on:
  push:
    branches: [dev]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Build de staging (base path /staging/)
        run: npm run build:staging

      - name: Ajustar .htaccess para subcarpeta /staging/
        run: |
          cat > dist/.htaccess <<'HTACCESS_EOF'
          <IfModule mod_rewrite.c>
            RewriteEngine On
            RewriteBase /staging/
            RewriteCond %{REQUEST_FILENAME} !-f
            RewriteCond %{REQUEST_FILENAME} !-d
            RewriteRule . /staging/index.html [L]
          </IfModule>

          <IfModule mod_headers.c>
            Header always set X-Content-Type-Options "nosniff"
            Header always set X-Frame-Options "DENY"
            Header always set Referrer-Policy "strict-origin-when-cross-origin"
            Header always set X-XSS-Protection "1; mode=block"
            Header always set Permissions-Policy "camera=(), microphone=(), geolocation=()"
          </IfModule>
          HTACCESS_EOF

      - name: Subir frontend (dist/) a Hostinger /staging/
        id: deploy_frontend
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          protocol: ftp
          local-dir: ./dist/
          server-dir: /domains/ampr.site/public_html/staging/
          log-level: verbose

      # Hostinger corta la conexion FTP de forma intermitente ("Timeout
      # (control socket)") — un segundo intento en una conexion nueva casi
      # siempre pasa.
      - name: Reintentar subida de frontend si el primer intento fallo
        if: steps.deploy_frontend.outcome == 'failure'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          protocol: ftp
          local-dir: ./dist/
          server-dir: /domains/ampr.site/public_html/staging/
          log-level: verbose

      # Mismo principio que el deploy de produccion: la Action (o lftp antes)
      # puede reportar exito sin haber subido nada de verdad. Verificamos
      # contra el sitio real, y si no coincide, subimos dist/ por FTP directo
      # via curl como respaldo antes de rendirnos.
      - name: Verificar que el staging realmente se publico (con respaldo por FTP directo)
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
        run: |
          EXPECTED=$(grep -o '/staging/assets/index-[A-Za-z0-9_-]*\.js' dist/index.html | head -1)
          if [ -z "$EXPECTED" ]; then
            echo "No se pudo determinar el bundle esperado desde dist/index.html"
            exit 1
          fi
          echo "Bundle esperado: $EXPECTED"

          check_live() {
            curl -s https://ampr.site/staging/ | grep -o '/staging/assets/index-[A-Za-z0-9_-]*\.js' | head -1
          }

          LIVE=""
          for i in 1 2 3; do
            LIVE=$(check_live)
            echo "Intento $i - bundle en vivo: $LIVE"
            if [ "$LIVE" = "$EXPECTED" ]; then
              echo "Deploy de staging verificado."
              exit 0
            fi
            sleep 10
          done

          echo "La Action no publico el build de staging. Subiendo dist/ por FTP directo como respaldo..."
          cd dist
          find . -type f | sed 's|^\./||' | while read -r f; do
            curl -s -T "$f" "ftp://$FTP_HOST/domains/ampr.site/public_html/staging/$f" --user "$FTP_USER:$FTP_PASS" --ftp-create-dirs -o /dev/null -w "  $f -> %{http_code}\n"
          done
          cd ..

          for i in 1 2 3; do
            sleep 5
            LIVE=$(check_live)
            echo "Post-respaldo intento $i - bundle en vivo: $LIVE"
            if [ "$LIVE" = "$EXPECTED" ]; then
              echo "Deploy de staging verificado tras respaldo por FTP directo."
              exit 0
            fi
          done

          echo "ERROR: staging sigue sin coincidir incluso tras el respaldo por FTP directo."
          echo "Esperado: $EXPECTED"
          echo "En vivo:  $LIVE"
          exit 1

      - name: Subir API (api/) a Hostinger /staging/api/
        id: deploy_api
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          protocol: ftp
          local-dir: ./api/
          server-dir: /domains/ampr.site/public_html/staging/api/
          log-level: verbose
          exclude: |
            **/config.php

      - name: Reintentar subida de API si el primer intento fallo
        id: deploy_api_retry
        if: steps.deploy_api.outcome == 'failure'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          protocol: ftp
          local-dir: ./api/
          server-dir: /domains/ampr.site/public_html/staging/api/
          log-level: verbose
          exclude: |
            **/config.php

      - name: Respaldo por FTP directo si ninguno de los dos intentos de API funciono
        if: steps.deploy_api.outcome == 'failure' && steps.deploy_api_retry.outcome != 'success'
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
        run: |
          echo "La Action fallo dos veces subiendo la API de staging. Subiendo por FTP directo como respaldo..."
          cd api
          find . -type f ! -name 'config.php' | sed 's|^\./||' | while read -r f; do
            curl -sf -T "$f" "ftp://$FTP_HOST/domains/ampr.site/public_html/staging/api/$f" --user "$FTP_USER:$FTP_PASS" --ftp-create-dirs -o /dev/null -w "  $f -> %{http_code}\n" || exit 1
          done
